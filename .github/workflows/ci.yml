name: CI

on:
  push:
  pull_request:

jobs:
  # Deterministic job — always runs. No network I/O, no secrets.
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run deterministic test suite
        run: npm test

  # Live job — always runs, but the smoke tests skip themselves when the
  # LIVE_RPC secret is not configured (never red on forks or repos without
  # the secret).
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live RPC smoke tests
        env:
          LIVE_RPC: ${{ secrets.LIVE_RPC }}
        run: |
          if [ -z "$LIVE_RPC" ]; then
            echo "LIVE_RPC not configured - skipping live smoke tests"
            exit 0
          fi
          npx vitest run tests/live.test.ts
